# Safety / behavior flags
- name: dryRun
  type: boolean
  default: false
  displayName: "Dry Run (no changes)"

- name: skipTeamFieldValues
  type: boolean
  default: false
  displayName: "Skip Team Field Values (AreaPath config)"

- name: skipTeamMembershipGroups
  type: boolean
  default: false
  displayName: "Skip Team Membership Group updates (Graph)"

- name: skipIterationAssignment
  type: boolean
  default: false
  displayName: "Skip Iteration Assignment"

pool:
  vmImage: ubuntu-latest

steps:
- checkout: self

# Guardrails to avoid accidental runs
- task: PowerShell@2
  displayName: "Validate parameters"
  inputs:
    pwsh: true
    targetType: inline
    script: |
      $team = "${{ parameters.teamName }}".Trim()
      if ([string]::IsNullOrWhiteSpace($team)) {
        Write-Error "TeamName is required."
        exit 1
      }

      # clients is a stringList; convertToJson yields JSON array string
      $clientsJson = '${{ convertToJson(parameters.clients) }}'
      $clients = @()
      if ($clientsJson -and $clientsJson -ne "[]") {
        $clients = $clientsJson | ConvertFrom-Json
      }

      if ($clients.Count -lt 1) {
        Write-Error "At least one client must be selected."
        exit 1
      }

      Write-Host "Validation OK. TeamName='$team'. Clients=$($clients -join ', ')"

# Run the bootstrap script
- task: PowerShell@2
  displayName: "Bootstrap Team (create team + areas + membership + iterations)"
  inputs:
    pwsh: true
    filePath: createTea,.ps1
    arguments: >
      -Organization "$(System.TeamFoundationCollectionUri)"
      -Project "$(System.TeamProject)"
      -TeamName "${{ parameters.teamName }}"
      -ClientsJson '${{ convertToJson(parameters.clients) }}'
      -DryRun:$${{ parameters.dryRun }}
      -SkipTeamFieldValues:$${{ parameters.skipTeamFieldValues }}
      -SkipTeamMembershipGroups:$${{ parameters.skipTeamMembershipGroups }}
      -SkipIterationAssignment:$${{ parameters.skipIterationAssignment }}
  env:
    # Use OAuth token (recommended) — requires "Allow scripts to access OAuth token"
    AZURE_DEVOPS_EXT_PAT: $(AZURE_DEVOPS_EXT_PAT)
