trigger: none

parameters:
- name: yearOfIteration
  type: number
  default: 0   # 0 = current year (your script behavior)

- name: teamName
  type: string
  default: "auto"  # blank = all teams (if your script supports it)

- name: skipIfAlreadyAssigned
  type: boolean
  default: true

pool:
  vmImage: ubuntu-latest
  
steps:
- checkout: self

- task: PowerShell@2
  displayName: "Guardrail: block past years"
  inputs:
    pwsh: true
    targetType: inline
    script: |
      $yearParam = [int]"${{ parameters.yearOfIteration }}"
      $currentYear = (Get-Date).Year

      if ($yearParam -eq 0) {
        Write-Host "YearOfIteration=0 => treated as current year ($currentYear)."
        exit 0
      }

      if ($yearParam -lt $currentYear) {
        Write-Error "Blocking run: YearOfIteration ($yearParam) is in the past. Current year is $currentYear."
        exit 1
      }

      Write-Host "OK: YearOfIteration ($yearParam) is current/future."


- task: PowerShell@2
  displayName: "Assign sprints under Year iteration to Team"
  inputs:
    pwsh: true
    filePath: assignYearSprintToTeam.ps1
    arguments: >
      -Organization "$(System.TeamFoundationCollectionUri)"
      -Project "$(System.TeamProject)"
      -TeamName "${{ parameters.teamName }}"
      -YearOfIteration ${{ parameters.yearOfIteration }}
      -SkipIfAlreadyAssigned:$${{ parameters.skipIfAlreadyAssigned }}
  env:
    AZURE_DEVOPS_EXT_PAT: $(ADO_PAT)
